<!doctype html>
<html lang="zh-CN" data-theme="apple">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="HotFM — 美国与中国 FM 电台在线收听" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HotFM</title>
    <script>
      // Mirror appearance migrations and retired-theme fallback before first paint.
      try {
        var saved = JSON.parse(localStorage.getItem('hotfm.library') || '{}')
        var state = saved.version >= 2 ? saved.state || {} : {}
        var t = ['apple', 'hifi'].includes(state.theme) ? state.theme : 'apple'
        if (
          t === 'apple' &&
          (state.colorMode === 'dark' || (state.colorMode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
        )
          t = 'apple-dark'
        document.documentElement.dataset.theme = t
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', { apple: '#f5f5f7', 'apple-dark': '#161618', hifi: '#0d0c0a' }[t])
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
